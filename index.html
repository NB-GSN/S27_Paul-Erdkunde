<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expedition Äquator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: Expeditions-Atlas. Karte oben als Bühne, darunter Stationskarten; Aufgaben als einzelne große Karten, tablet-first. */
:root{
  --bg:#e8efed; --panel:#fbfdfc; --panel2:#eef4f2; --ink:#13303a; --muted:#56717b; --line:#cbdad7;
  --ocean:#cfe4ec; --landc:#efe7d4; --coast:#a99a7c; --grid:#86a6b1; --locked:#b7c3c4;
  --pri:#0c6a70; --pri-ink:#ffffff; --gold:#d99a00; --ok:#2c8547; --okbg:#e1f2e5; --bad:#c03d2c; --badbg:#fbe6e2;
  --temp:#d1342b; --prec:#2a74c9; --hint:#fff3d1; --hintink:#5e4500; --boss:#6b3fb8; --sel:#dbeef0;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1c21; --panel:#14282e; --panel2:#1a3239; --ink:#e3eeec; --muted:#93afb2; --line:#29444c;
  --ocean:#11343e; --landc:#36473c; --coast:#5f7466; --grid:#4f7380; --locked:#46585c;
  --pri:#40b8b0; --pri-ink:#04201f; --gold:#f2b632; --ok:#5cc47a; --okbg:#16362a; --bad:#ff7d69; --badbg:#3c1f1b;
  --temp:#ff6b5d; --prec:#62a9ff; --hint:#3a3116; --hintink:#f5dc96; --boss:#a98aff; --sel:#1d3f45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1c21; --panel:#14282e; --panel2:#1a3239; --ink:#e3eeec; --muted:#93afb2; --line:#29444c;
  --ocean:#11343e; --landc:#36473c; --coast:#5f7466; --grid:#4f7380; --locked:#46585c;
  --pri:#40b8b0; --pri-ink:#04201f; --gold:#f2b632; --ok:#5cc47a; --okbg:#16362a; --bad:#ff7d69; --badbg:#3c1f1b;
  --temp:#ff6b5d; --prec:#62a9ff; --hint:#3a3116; --hintink:#f5dc96; --boss:#a98aff; --sel:#1d3f45; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:1100px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.35rem,2.8vw,1.8rem);font-weight:800}
h3{font-size:1.2rem;font-weight:800}
h4{font-size:1rem;font-weight:600;color:var(--muted)}
p{margin:0}
.small{font-size:.9rem;color:var(--muted)}
.muted{color:var(--muted)}
.lead{font-size:1.05rem;max-width:65ch}
.kicker{font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.btn{font:inherit;font-weight:700;border-radius:999px;border:2px solid transparent;padding:10px 18px;cursor:pointer;min-height:46px;color:var(--ink);background:transparent;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--pri);color:var(--pri-ink)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{border-color:var(--line);background:var(--panel)}
.btn.ghost:disabled{opacity:.5}
.btn.big{font-size:1.1rem;padding:12px 26px;min-height:54px}
.btn.small{min-height:40px;padding:6px 14px;font-size:.9rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:not(.ghost){background:var(--bad);color:var(--pri-ink)}
.linkbtn{font:inherit;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--bad);color:#fff;font-size:.75rem;margin-left:4px;padding:0 6px}
/* Kopf */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.top .sub{color:var(--muted);margin-top:4px;font-family:var(--mono);font-size:.85rem}
.topnav{display:flex;gap:8px;flex-wrap:wrap}
.namecard label{font-family:var(--display);font-weight:800;font-size:1.2rem;display:block;margin-bottom:8px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px}
#nameIn{flex:1;min-width:0;max-width:320px}
/* Karte */
.mapcard{padding:10px}
.worldmap{width:100%;height:auto;display:block;border-radius:10px;touch-action:manipulation}
.m-ocean{fill:var(--ocean)}
.m-land{fill:var(--landc);stroke:var(--coast);stroke-width:.6}
.m-lat{stroke:var(--grid);stroke-width:1;stroke-dasharray:5 5;opacity:.8}
.m-eq{stroke-width:1.6;stroke-dasharray:none}
.m-latlab{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.m-route{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-dasharray:2 6;stroke-linecap:round;opacity:.55}
.m-st{cursor:pointer}
.m-st.locked{cursor:not-allowed;opacity:.75}
.m-dot{stroke:var(--panel);stroke-width:3}
.m-st.done .m-dot{stroke:var(--gold);stroke-width:3.5}
.m-num{font-family:var(--display);font-weight:800;font-size:15px;fill:#11242a;pointer-events:none}
.m-pulse{fill:none;stroke:var(--gold);stroke-width:3;animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{transform:scale(.7);opacity:1}to{transform:scale(1.5);opacity:0}}
.m-bossdot{fill:var(--boss);opacity:.2}
.m-boss.locked{opacity:.45}
.sw{fill:none;stroke:var(--boss);stroke-width:3;stroke-linecap:round}
.swirl{animation:spin 6s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(-360deg)}}
.maphint{padding:8px 6px 2px;color:var(--muted);font-size:.92rem}
/* Stationskarten */
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.stcard{font:inherit;color:var(--ink);text-align:left;display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);cursor:pointer;position:relative;overflow:hidden;min-height:88px}
.stcard::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:var(--z)}
.stcard.locked{opacity:.55;cursor:not-allowed}
.stnum{font-family:var(--display);font-weight:800;font-size:1.6rem;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--z);color:#11242a;flex:none;margin-left:4px}
.stbody{display:flex;flex-direction:column;min-width:0;flex:1}
.stzone{font-size:.78rem;color:var(--muted)}
.stzone .bonus{color:var(--pri)}
.stname{font-family:var(--display);font-weight:800;font-size:1.15rem}
.stplace{font-size:.88rem;color:var(--muted)}
.ststars{color:var(--gold);font-size:1.1rem;letter-spacing:1px;flex:none;font-size:.95rem}
.bosscard{grid-column:1/-1;--z:var(--boss)}
.bossicon{width:48px;display:grid;place-items:center;flex:none}
.foot{text-align:center}
/* Intro */
.crumbs{display:flex;gap:8px}
.intro{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;border-top:8px solid var(--z)}
.introtext{display:flex;flex-direction:column;gap:12px;min-width:0}
.story{font-size:1.08rem;max-width:60ch}
.meta{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.introside{min-width:0}
@media (max-width:760px){.intro{grid-template-columns:1fr}}
.lernkarte{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lk-head{background:var(--z);padding:12px 18px;color:#11242a}
.lk-head .lk-zone{font-family:var(--mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.lernkarte dl{margin:0;padding:6px 18px 14px;display:grid;gap:0}
.lernkarte dl>div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.lernkarte dl>div:last-child{border-bottom:0}
.lernkarte dt{font-weight:700}
.lernkarte dd{margin:0}
@media (max-width:560px){.lernkarte dl>div{grid-template-columns:1fr;gap:2px}}
.pagetitle{font-size:clamp(1.6rem,3.5vw,2.2rem)}
.atlasgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-items:start}
.method ol{margin:10px 0;padding-left:22px;display:grid;gap:4px}
.method p{margin-top:8px}
/* Klimadiagramm */
.climate{width:100%;max-width:520px;height:auto;display:block;background:var(--panel2);border-radius:10px}
.cd-grid{stroke:var(--line);stroke-width:1}
.cd-zero{stroke:var(--ink);stroke-width:1.4}
.cd-ax{stroke-width:2}
.cd-axt{stroke:var(--temp)} .cd-axn{stroke:var(--prec)}
.cd-break{stroke:var(--prec);stroke-width:1.5;fill:none}
.cd-lab{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.cd-lab.cd-t,.cd-unit.cd-t{fill:var(--temp)} .cd-lab.cd-n,.cd-unit.cd-n{fill:var(--prec)}
.cd-unit{font-family:var(--mono);font-size:11px;font-weight:700}
.cd-title{font-family:var(--display);font-weight:800;font-size:14px;fill:var(--ink)}
.cd-sub{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.cd-bar{fill:var(--prec);opacity:.85}
.cd-bar.err{fill:var(--bad);opacity:1}
.cd-line{fill:none;stroke:var(--temp);stroke-width:2.5;stroke-linejoin:round}
.cd-dot{fill:var(--temp)}
.cd-dot.err{fill:var(--bad);stroke:var(--panel);stroke-width:2}
.cd-tap{fill:transparent;cursor:pointer}
.cd-tap.on{fill:var(--gold);opacity:.32}
.cd-tap.ok{fill:var(--ok);opacity:.3} .cd-tap.miss{fill:var(--gold);opacity:.35;stroke:var(--bad);stroke-width:2;stroke-dasharray:4 3} .cd-tap.bad{fill:var(--bad);opacity:.3}
.cd-drag{fill:transparent;cursor:ns-resize}
.drawdiag .climate{max-width:620px;touch-action:none}
.tablewrap{overflow-x:auto;margin-top:10px}
.ctab{border-collapse:collapse;font-family:var(--mono);font-size:.82rem;font-variant-numeric:tabular-nums;width:100%;min-width:440px}
.ctab th,.ctab td{border:1px solid var(--line);padding:5px 4px;text-align:center}
.ctab tbody th{color:var(--muted)}
.ctab tbody tr:first-child td{color:var(--temp)} .ctab tbody tr:last-child td{color:var(--prec)}
/* Aufgaben */
.taskhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tinfo{display:flex;flex-direction:column;line-height:1.2}
.tinfo b{font-family:var(--display);font-size:1.1rem}
.tinfo span{font-size:.85rem;color:var(--muted)}
.pdots{display:flex;gap:6px;margin-left:auto}
.pdot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.pdot.ok{background:var(--ok)} .pdot.bad{background:var(--bad)} .pdot.now{background:var(--z);box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--z)}
.task{display:flex;flex-direction:column;gap:16px;padding:22px}
.task .q{font-size:clamp(1.2rem,2.4vw,1.5rem);max-width:60ch}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;min-height:56px;display:flex;gap:12px;align-items:center}
.opt.sel{border-color:var(--pri);background:var(--sel)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);text-decoration:line-through;text-decoration-thickness:1px}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default}
.opt .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:none}
.opt.sel .box{background:var(--pri);border-color:var(--pri);box-shadow:inset 0 0 0 3px var(--panel2)}
.hints{display:grid;gap:8px}
.hint{background:var(--hint);color:var(--hintink);padding:10px 14px;border-radius:10px}
.fb{padding:14px 16px;border-radius:12px;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--okbg);border:2px solid var(--ok)}
.fb.bad{background:var(--badbg);border:2px solid var(--bad)}
.fb.retry{background:var(--hint);color:var(--hintink)}
.fb b{font-family:var(--display);font-size:1.1rem}
.fb .note{font-size:.85rem;color:var(--muted)}
.hit{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--boss)}
.hit.ouch{color:var(--bad)}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chip{font:inherit;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;text-align:left;min-height:48px;width:100%}
.chip.right{border-color:var(--ok);background:var(--okbg)} .chip.wrong{border-color:var(--bad);background:var(--badbg)}
.ordergrid,.matchgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:600px){.ordergrid{grid-template-columns:1fr}}
.pool{display:grid;gap:8px;margin-top:8px}
.answer{margin:8px 0 0;padding-left:26px;display:grid;gap:8px}
.answer li::marker{font-family:var(--mono);color:var(--muted)}
.answer li.empty{height:48px;border:2px dashed var(--line);border-radius:10px}
.chip.placed{border-color:var(--pri)}
.mcol{display:grid;gap:8px;align-content:start}
.chip.m.sel{border-color:var(--gold);background:var(--hint);color:var(--hintink)}
.chip.m.paired{border-color:var(--pc)}
.pn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pc);color:#fff;font-size:.8rem;font-weight:700;margin-right:8px}
.solution{background:var(--panel2);border-radius:10px;padding:12px 14px}
.solution ol,.solution ul{margin:6px 0 0;padding-left:22px}
.numwrap,.freewrap{display:flex;flex-direction:column;gap:8px}
.numwrap label,.freewrap label{font-weight:700}
#numIn{font-family:var(--mono);font-size:1.4rem;width:180px}
.unit{font-family:var(--mono);font-size:1.2rem}
textarea{width:100%;resize:vertical;line-height:1.5}
.selfcheck{background:var(--panel2);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-top:14px}
.model{border-left:4px solid var(--pri);padding-left:12px}
.ck{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:4px 0}
.ck input{width:24px;height:24px;min-height:0;flex:none;margin-top:1px}
.mapwrap .worldmap{cursor:crosshair}
.pin-hit{fill:transparent}
.pin-dot{fill:var(--bad);stroke:var(--panel);stroke-width:3}
.tgt{fill:var(--ok);opacity:.25;stroke:var(--ok);stroke-width:2}
.tgl{font-family:var(--display);font-weight:800;font-size:15px;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.units{display:flex;gap:14px;flex-wrap:wrap}
.units label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.92rem}
.modes{display:flex;gap:8px;flex-wrap:wrap}
.btn.mode{border-color:var(--line);background:var(--panel2)}
.btn.mode.on{background:var(--ink);color:var(--bg)}
.live{font-family:var(--mono);color:var(--ink);font-weight:700}
/* Boss */
.bosshead{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.bossbar{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.bb-label{display:flex;align-items:center;gap:8px;font-family:var(--display)}
.hpbar{height:16px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.hpbar span{display:block;height:100%;background:linear-gradient(90deg,var(--boss),var(--bad));transition:width .5s}
.hearts{display:flex;align-items:center;gap:6px}
.h{width:22px;height:20px;display:inline-block;background:var(--line);clip-path:path("M11 19 L2 10 A5 5 0 0 1 11 4 A5 5 0 0 1 20 10 Z")}
.h.on{background:var(--bad)}
.jk{font-family:var(--mono);font-size:.85rem;margin-left:8px;color:var(--muted)}
.bossintro{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:640px){.bossintro{grid-template-columns:1fr;justify-items:center}}
.bossintro>div:last-child{display:flex;flex-direction:column;gap:12px}
.rules{margin:0;padding-left:20px;display:grid;gap:6px}
.bossbig.defeated .swirl{animation:spin 1.2s linear infinite;opacity:.4}
/* Ergebnis */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:32px 20px}
.bigstars{font-size:2.6rem;color:var(--gold);letter-spacing:6px}
.stampin{animation:stampin .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampin{from{transform:scale(2.2) rotate(-25deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.stamp .st-o{fill:none;stroke:var(--z);stroke-width:4}
.stamp .st-i{fill:color-mix(in srgb,var(--z) 18%,transparent);stroke:var(--z);stroke-width:1.5;stroke-dasharray:3 3}
.stamp .st-t{font-family:var(--display);font-weight:800;font-size:11px;fill:var(--ink);letter-spacing:1px}
.stamp .st-n{font-family:var(--display);font-weight:800;font-size:22px;fill:var(--ink)}
.stamp .st-s{font-family:var(--mono);font-size:8px;fill:var(--muted)}
.passgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.passslot{aspect-ratio:1/1.1;max-width:100%;border:2px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:10px;color:var(--muted)}
.passslot.has{border-style:solid;background:var(--panel)}
.passslot.has .stamp{transform:rotate(-8deg)}
.passslot small{color:var(--gold)}
/* Tagebuch / Eltern */
.dlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.dlist li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.dz,.pz{font-size:.78rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.dz::before,.pz::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--z)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column}
.kpi b{font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.9rem}
.ptable{display:grid;gap:10px;margin-top:12px}
.prow{display:grid;grid-template-columns:150px minmax(80px,1fr) minmax(0,1.3fr);gap:12px;align-items:center}
@media (max-width:640px){.prow{grid-template-columns:1fr}}
.pbar{height:12px;border-radius:6px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%}
.pv{font-family:var(--mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.advice{margin-top:14px;background:var(--hint);color:var(--hintink);padding:10px 14px;border-radius:10px}

      h:["Was passiert mit gefrorenem Boden, wenn es wärmer wird?","Im Boden stecken abgestorbene Pflanzenreste.","Beim Auftauen entweichen Treibhausgase."],
      e:"Taut der Permafrost, sacken Gebäude und Straßen ab. Außerdem zersetzen sich Pflanzenreste im Boden und geben Treibhausgase wie Methan ab. Das heizt den Klimawandel weiter an."},
    {t:"mc",l:1,q:"Wo liegt die subpolare Zone?",o:["Zwischen der polaren Zone und der Nadelwaldzone, ungefähr um den Polarkreis","Direkt am Äquator","Zwischen Wüste und Savanne","Nur in Grönland"],
      h:["„Sub“ heißt „unter“ oder „unterhalb“.","Also gleich unterhalb der polaren Zone.","Südlich davon kommt die Taiga."],
      e:"Die subpolare Zone (Tundra) liegt zwischen der polaren Zone und dem Nadelwald, ungefähr um den nördlichen Polarkreis."},
    {t:"mc",l:2,q:"Was ist der Polartag in Utqiaġvik?",o:["Im Sommer geht die Sonne etwa zweieinhalb Monate lang nicht unter","Ein Feiertag der Inuit","Der eine Tag im Jahr, an dem die Sonne scheint","Die Zeit, in der es den ganzen Tag dunkel ist"],
      h:["Das Gegenteil ist die Polarnacht.","Es ist Sommer.","Die Sonne bleibt über dem Horizont."],
      e:"Von Mitte Mai bis Anfang August geht die Sonne in Utqiaġvik nicht unter (Polartag). Im Winter bleibt sie etwa zwei Monate lang unter dem Horizont (Polarnacht)."},
    {t:"free",l:3,q:"Erkläre in eigenen Worten, warum die Tundra trotz wenig Niederschlag (etwa 110 mm im Jahr) im Sommer nass und sumpfig ist.",
      m:"Weil es so kalt ist, verdunstet nur sehr wenig Wasser. Im Sommer taut nur die oberste Bodenschicht auf. Darunter ist Permafrost, also dauerhaft gefrorener Boden. Das Schmelzwasser kann nicht versickern und staut sich, so entstehen Sümpfe und Seen.",
      c:["Wenig Verdunstung wegen der Kälte","Nur die obere Bodenschicht taut auf","Permafrost darunter","Wasser kann nicht versickern, Sümpfe entstehen"],
      h:["Wohin kann Wasser normalerweise verschwinden? Nach unten und nach oben.","Nach oben: Verdunstung. Nach unten: Versickern.","Beides klappt in der Tundra kaum."],
      e:"Wichtig sind zwei Gründe: kaum Verdunstung (kalt) und kein Versickern (Permafrost)."},
    {t:"match",l:2,q:"Ordne zu: Was gehört wohin?",p:[["Permafrost","dauerhaft gefrorener Boden"],["Zwergbirke","Pflanze der Tundra"],["Nenzen","Volk, das Rentiere züchtet"],["Norilsk","Bergbaustadt in Sibirien"]],
      h:["Ein Volk, eine Stadt, eine Pflanze, ein Bodenbegriff.","Norilsk ist bekannt für Nickel-Bergbau.","Die Nenzen leben in Nordrussland."],
      e:"Permafrost = gefrorener Boden, Zwergbirke = Tundrapflanze, Nenzen = Rentierzüchter, Norilsk = Bergbaustadt."}
  ]
},

    "Menschen & Nutzung":"Dünn besiedelt. Holzwirtschaft, Bergbau (Gold, Diamanten), Erdöl und Erdgas.",

    {t:"mc",l:2,q:"Warum haben Nadelbäume in der Taiga einen Vorteil gegenüber Laubbäumen?",o:["Sie behalten ihre Nadeln und können im kurzen Sommer sofort wachsen. Nadeln verlieren wenig Wasser bei Frost","Nadelbäume brauchen kein Licht","Nadelbäume wachsen nur im Winter","Laubbäume werden von Elchen gefressen"],

    {t:"mc",l:2,q:"Aus welcher Landschaftszone stammt dieses Klimadiagramm?",d:"jakutsk",dh:true,o:["Nadelwald (Taiga)","Tundra","Laub- und Mischwald","Eiswüste"],
      h:["Schau auf den Sommer: Wie warm wird es?","Mehrere Monate über 10 °C, also können Bäume wachsen.","Aber sehr eisige Winter."],

    {t:"mc",l:3,q:"Warum sind die Winter in Jakutsk so viel kälter als in Düsseldorf?",o:["Jakutsk liegt weit vom Meer entfernt. Das Meer speichert Wärme und mildert die Temperatur","Jakutsk liegt höher in den Bergen","In Jakutsk scheint nie die Sonne","Jakutsk liegt am Südpol"],

      e:"Das Meer speichert im Sommer Wärme und gibt sie im Winter ab. Düsseldorf liegt nah am Atlantik (Seeklima). Jakutsk liegt tief im Kontinent (Kontinentalklima): heiße Sommer, extrem kalte Winter."},
    {t:"mc",l:1,q:"Wie heißt der Nadelwald in Russland?",o:["Taiga","Tundra","Savanne","Macchie"],
      h:["Der Begriff kommt aus dem Russischen.","Tundra ist die Zone ohne Bäume.","T-a-i-..."],
      e:"Der Nadelwald heißt in Russland Taiga. Es ist das größte Waldgebiet der Erde."},
    {t:"map",l:2,q:"Tippe auf Sibirien.",g:[{n:"Sibirien",b:[60,50,180,75]}],
      h:["Sibirien ist der asiatische Teil Russlands.","Östlich des Uralgebirges.","Oben rechts auf der Karte."],
      e:"Sibirien reicht vom Ural bis zum Pazifik. Ein großer Teil davon ist von Taiga bedeckt."},
    {t:"multi",l:2,q:"Wie nutzen Menschen die Taiga? Wähle alle richtigen.",o:["Holzwirtschaft","Bergbau (z. B. Gold, Diamanten)","Erdöl- und Erdgasförderung","Bananenanbau","Baumwollanbau"],a:[0,1,2],

      e:"Holzwirtschaft, Bergbau und Erdöl/Erdgas. Ackerbau ist wegen der kurzen Sommer kaum möglich."},
    {t:"mc",l:1,q:"Welches Tier lebt typischerweise im Nadelwald?",o:["Elch","Zebra","Kamel","Pinguin"],

wueste: {

    "Menschen & Nutzung":"Leben in Oasen und an Flüssen wie dem Nil. Nomaden, Erdöl, Tourismus.",

    {t:"mc",l:1,q:"Wie viele humide Monate hat Assuan?",d:"assuan",o:["0","3","6","12"],

    {t:"mc",l:3,q:"Warum liegen viele Wüsten ungefähr an den Wendekreisen?",o:["Dort sinkt trockene Luft ab, es bilden sich kaum Wolken","Dort ist die Erde der Sonne am nächsten","Dort gibt es keine Meere","Dort weht kein Wind"],
      h:["Was braucht man für Regen? Wolken.","Wolken entstehen, wenn feuchte Luft aufsteigt.","An den Wendekreisen passiert das Gegenteil."],

    {t:"mc",l:2,q:"Warum wird es in der Wüste nachts oft sehr kalt?",o:["Ohne Wolken entweicht die Wärme des Bodens schnell in den Himmel","Weil nachts kalter Wind vom Nordpol kommt","Weil der Sand Kälte speichert","Das stimmt nicht, nachts ist es genauso heiß"],

    {t:"multi",l:2,q:"Wie sind Wüstenpflanzen an die Trockenheit angepasst? Wähle alle richtigen.",o:["Sehr lange Wurzeln bis zum Grundwasser","Wasserspeicher im Stamm oder in den Blättern","Kleine Blätter oder Dornen statt Blätter","Große, dünne Blätter","Sie wachsen nur im Winter in Deutschland"],a:[0,1,2],
      h:["Drei sind richtig.","Wie kommt man an Wasser? Und wie hält man es fest?","Große Blätter verdunsten viel."],
      e:"Lange Wurzeln, Wasserspeicher (z. B. Sukkulenten) und kleine Blätter oder Dornen, damit wenig Wasser verdunstet."},
    {t:"mc",l:1,q:"Was ist eine Oase?",o:["Ein Ort in der Wüste mit Wasser, an dem Pflanzen wachsen und Menschen leben","Eine Sanddüne","Eine Luftspiegelung in der Wüste","Ein Zelt der Nomaden"],
      h:["Grün mitten im Sand.","Es gibt dort eine Quelle oder Grundwasser.","Dattelpalmen wachsen dort."],

      h:["Assuan liegt an einem berühmten Fluss.","Woher kommt das Wasser des Flusses?","Der Nil entspringt in Ostafrika, wo es viel regnet."],

      e:"Summe 312, geteilt durch 12 = 26 °C."},
    {t:"multi",l:1,q:"Welche Tiere leben in der Wüste? Wähle alle richtigen.",o:["Dromedar","Wüstenfuchs (Fennek)","Skorpion","Eisbär","Biber"],a:[0,1,2],

      e:"Dromedar, Fennek und Skorpion. Der Fennek gibt über seine großen Ohren Wärme ab."}
  ]
},

<script>
/* ============ HILFSFUNKTIONEN ============ */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const app = document.getElementById("app");
const MON = ["J","F","M","A","M","J","J","A","S","O","N","D"];
const MONL = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const fmt = n => String(n).replace(".", ",").replace("-", "−");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sum = a => a.reduce((x, y) => x + y, 0);
const mean1 = a => Math.round(sum(a) / a.length * 10) / 10;

/* Task-IDs vergeben */
const ALL_TASKS = {};
for (const id of ROUTE) STATIONS[id].tasks.forEach((t, i) => { t.id = id + "-" + i; t.st = id; ALL_TASKS[t.id] = t; });
BOSS_TASKS.forEach((t, i) => { t.id = "boss-" + i; t.st = "boss"; ALL_TASKS[t.id] = t; });

/* ============ SPEICHER ============ */
const LS = "expedition-aequator-v1";
function blank() { return {v:1, name:"", stamps:{}, stats:{}, diary:[], mastered:{}, time:0, log:[], boss:{tries:0, wins:0, best:null}, unlockAll:false}; }
let S = (() => { try { const s = JSON.parse(localStorage.getItem(LS)); if (s && s.v === 1) return Object.assign(blank(), s); } catch (e) {} return blank(); })();
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
function stat(id) { return S.stats[id] || (S.stats[id] = {answered:0, correct:0, first:0, hints:0}); }

let R = null; // aktuelle Runde
setInterval(() => { if (R && document.visibilityState === "visible") { S.time += 5; save(); } }, 5000);

/* ============ KLIMADIAGRAMM ============ */
function geom(T, N) {
  const uN = n => n <= 100 ? n / 20 : 5 + (n - 100) / 100;
  const topU = Math.max(3, Math.ceil(Math.max(...T) / 10 - 1e-9), Math.ceil(uN(Math.max(...N)) - 1e-9));
  const botU = Math.min(0, Math.floor(Math.min(...T) / 10));
  const U = 22, L = 44, Rm = 48, TOP = 62, B = 26, colW = 26;
  const W = L + 12 * colW + Rm, H = TOP + (topU - botU) * U + B, y0 = TOP + topU * U;
  const tLabMax = Math.min(topU, Math.max(3, Math.ceil(Math.max(...T) / 10 - 1e-9)) + 1);
  return { U, L, Rm, TOP, B, colW, W, H, y0, topU, botU, uN, tLabMax,
    yT: t => y0 - t / 10 * U, yN: n => y0 - uN(n) * U, xC: i => L + i * colW + colW / 2,
    tFromY: y => (y0 - y) / U * 10,
    nFromY: y => { const u = (y0 - y) / U; return u <= 5 ? u * 20 : 100 + (u - 5) * 100; } };
}
function axesSVG(g, header) {
  let s = "";
  for (let k = g.botU; k <= g.topU; k++) {
    const y = g.y0 - k * g.U;
    s += `<line x1="${g.L}" x2="${g.L + 12 * g.colW}" y1="${y}" y2="${y}" class="${k === 0 ? "cd-zero" : "cd-grid"}"/>`;
    if (k <= g.tLabMax) s += `<text x="${g.L - 6}" y="${y + 4}" class="cd-lab cd-t" text-anchor="end">${fmt(k * 10)}</text>`;
    if (k > 0) s += `<text x="${g.L + 12 * g.colW + 6}" y="${y + 4}" class="cd-lab cd-n">${k <= 5 ? k * 20 : 100 + (k - 5) * 100}</text>`;
  }
  s += `<line x1="${g.L}" x2="${g.L}" y1="${g.TOP - 6}" y2="${g.y0 - g.botU * g.U}" class="cd-ax cd-axt"/>`;
  s += `<line x1="${g.L + 12 * g.colW}" x2="${g.L + 12 * g.colW}" y1="${g.TOP - 6}" y2="${g.y0}" class="cd-ax cd-axn"/>`;
  if (g.topU > 5) { const y = g.y0 - 5 * g.U; s += `<path d="M${g.L + 12 * g.colW - 5} ${y - 3} l10 -4 M${g.L + 12 * g.colW - 5} ${y + 1} l10 -4" class="cd-break"/>`; }

function climateSVG(key, o = {}) {

  s += `<polyline points="${c.T.map((t, i) => g.xC(i) + "," + g.yT(t)).join(" ")}" class="cd-line"/>`;

const MK = 1000 / 360, MTOP = 84, MH = 450;
const proj = (lon, lat) => [(lon + 180) * MK, (MTOP - lat) * MK];
const unproj = (x, y) => [x / MK - 180, MTOP - y / MK];
function mapBase(extra = "") {
  const lines = [[0, "Äquator", "eq"], [23.44, "Wendekreis", "tr"], [-23.44, "Wendekreis", "tr"], [66.56, "Polarkreis", "pc"], [-66.56, "Polarkreis", "pc"]];
  let s = `<rect width="1000" height="${MH}" class="m-ocean"/><use href="#land" class="m-land"/>`;
  for (const [lat, lab, cl] of lines) { const y = proj(0, lat)[1]; s += `<line x1="0" x2="1000" y1="${y}" y2="${y}" class="m-lat m-${cl}"/><text x="994" y="${y - 4}" text-anchor="end" class="m-latlab">${lab}</text>`; }
  return `<svg class="worldmap" viewBox="0 0 1000 ${MH}" role="img" aria-label="Weltkarte">${s}${extra}</svg>`;
}
function svgPoint(svg, ev) { const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }

const unlocked = i => S.unlockAll || i === 0 || !!S.stamps[ROUTE[i - 1]];
const bossOpen = () => S.unlockAll || ROUTE.every(id => S.stamps[id]);
const totalStars = () => ROUTE.reduce((a, id) => a + (S.stamps[id] ? S.stamps[id].stars : 0), 0);

function routePath() {
  const pts = ROUTE.map(id => [STATIONS[id].lon, STATIONS[id].lat]);
  let d = "";
  for (let i = 0; i < pts.length - 1; i++) {
    let [a, b] = [pts[i], pts[i + 1]];
    const [x1, y1] = proj(...a), [x2, y2] = proj(...b);
    if (Math.abs(b[0] - a[0]) > 180) { // über die Datumsgrenze
      const yMid = (y1 + y2) / 2;
      d += `M${x1} ${y1} L0 ${yMid} M1000 ${yMid} L${x2} ${y2} `;
    } else d += `M${x1} ${y1} L${x2} ${y2} `;
  }
  return `<path d="${d}" class="m-route"/>`;
}
function home() {

function swirl(x, y, r) {

}

/* ============ RUNDEN ============ */
function startStation(id) {
  const st = STATIONS[id];
  R = { kind:"station", id, st, n:st.round, i:0, target:1.4, used:new Set(), pts:0, correct:0, log:[] };
  nextStation();
}
function pickStationTask() {
  const pool = R.st.tasks.filter(t => !R.used.has(t.id));
  const must = pool.find(t => t.must && !S.mastered[t.id]);
  if (must && R.i >= 1) return must;
  let best = null, bs = 1e9;
  for (const t of pool) { const sc = Math.abs(t.l - R.target) + (S.mastered[t.id] ? 0.9 : 0) + Math.random() * 0.7; if (sc < bs) { bs = sc; best = t; } }
  return best;
}
function nextStation() {
  if (R.i >= R.n) return finishStation();
  const t = pickStationTask(); R.used.add(t.id);
  const dots = Array.from({length: R.n}, (_, k) => `<span class="pdot ${k < R.i ? (R.log[k] ? "ok" : "bad") : k === R.i ? "now" : ""}"></span>`).join("");
  showTask(t, {
    head: `<div class="taskhead" style="--z:${R.st.color}"><button class="btn ghost small" id="quit">← Abbrechen</button><div class="tinfo"><b>${esc(R.st.name)}</b><span>Aufgabe ${R.i + 1} von ${R.n}</span></div><div class="pdots">${dots}</div></div>`,
    tries: 2, onDone: res => {
      record(t, res); R.log.push(res.ok); R.pts += res.pts; if (res.ok) R.correct++;
      R.target = Math.max(1, Math.min(3, R.target + (res.ok ? (res.hints === 0 && res.attempt === 1 ? 0.7 : 0.2) : -0.8)));
      R.i++; nextStation();
    }
  });
}
function finishStation() {
  const ratio = R.pts / (3 * R.n), passed = R.correct >= Math.ceil(R.n / 2);
  const stars = ratio >= 0.78 ? 3 : ratio >= 0.5 ? 2 : 1;
  const id = R.id, prev = S.stamps[id];
  if (passed) S.stamps[id] = { stars: Math.max(stars, prev ? prev.stars : 0), at: Date.now() };
  S.log.push({ at: Date.now(), what: R.st.name, correct: R.correct, n: R.n, stars: passed ? stars : 0 }); save();
  const nextIdx = ROUTE.indexOf(id) + 1, nextId = ROUTE[nextIdx];
  R = null;
  app.innerHTML = `<section class="result card">
    ${passed ? `<div class="stampin">${stampSVG(id, 150)}</div><h2>Stempel erhalten!</h2>` : `<h2>Fast geschafft</h2>`}
    <p class="bigstars" aria-label="${passed ? stars : 0} Sterne">${passed ? "★".repeat(stars) + "☆".repeat(3 - stars) : "☆☆☆"}</p>
    <p class="lead">${S.log[S.log.length - 1].correct} von ${S.log[S.log.length - 1].n} Aufgaben richtig.
    ${passed ? (stars === 3 ? "Stark, volle Punktzahl für den Forscherausweis!" : "Für 3 Sterne: Aufgaben beim ersten Versuch und ohne Tipps lösen.") : `Für den Stempel brauchst du mindestens ${Math.ceil(STATIONS[id].round / 2)} richtige Aufgaben. Lies die Lernkarte nochmal und versuch es erneut. Die Aufgaben sind jedes Mal etwas anders.`}</p>
    <div class="row center">
      <button class="btn ghost" id="again">Nochmal spielen</button>
      ${passed && nextId ? `<button class="btn primary" id="next">Weiter nach: ${esc(STATIONS[nextId].name)}</button>` : ""}
      ${passed && !nextId ? `<button class="btn primary" id="boss">Zum Wetterwirbel</button>` : ""}
      <button class="btn ghost" id="map">Zur Karte</button></div></section>`;
  $("#again").onclick = () => stationIntro(id); $("#map").onclick = home;
  if ($("#next")) $("#next").onclick = () => stationIntro(nextId);
  if ($("#boss")) $("#boss").onclick = bossIntro;
  window.scrollTo(0, 0);
}
function record(t, res) {
  const s = stat(t.st); s.answered++; if (res.ok) s.correct++; if (res.ok && res.attempt === 1 && res.hints === 0) s.first++; s.hints += res.hints;
  if (res.ok) { S.mastered[t.id] = (S.mastered[t.id] || 0) + 1; }
  else if (!S.diary.includes(t.id)) S.diary.push(t.id);
  if (res.ok && R && R.kind === "review") S.diary = S.diary.filter(x => x !== t.id);
  save();
}

function bossIntro() {
  app.innerHTML = `<div class="crumbs"><button class="btn ghost" id="back">← Karte</button></div>
  <section class="bossintro card"><div class="bossbig"><svg viewBox="0 0 120 120" width="160" height="160">${swirl(60, 60, 50)}</svg></div>
    <div><p class="kicker">Endgegner · Probetest</p><h2>Der Wetterwirbel</h2>
    <p class="story">Mitten über dem Atlantik, genau am Äquator, braut sich etwas zusammen. Der Wetterwirbel hat alle Klimadiagramme durcheinandergewirbelt und die Stationen vertauscht. Nur wer alle Zonen kennt, kann ihn stoppen.</p>
    <ul class="rules"><li>Jede richtige Antwort trifft den Wirbel. <b>10 Treffer</b> und er ist besiegt.</li>
    <li>Jede falsche Antwort kostet ein Herz. Du hast <b>4 Herzen</b>.</li>
    <li>Wie in einer echten Arbeit gibt es nur <b>einen Versuch</b> pro Aufgabe und nur <b>3 Joker</b> (Tipps) für den ganzen Kampf.</li>
    <li>Bei Aufgaben „mit eigenen Worten“ vergleichst du ehrlich mit der Musterlösung.</li></ul>
    <button class="btn primary big" id="fight">Kampf beginnen</button></div></section>`;
  $("#back").onclick = home; $("#fight").onclick = startBoss; window.scrollTo(0, 0);
}
function startBoss() {
  const extra = shuffle(ROUTE.flatMap(id => STATIONS[id].tasks.filter(t => t.l >= 2 && t.t !== "draw")));
  R = { kind:"boss", hp:10, max:10, hearts:4, jokers:3, q: shuffle(BOSS_TASKS).concat(extra), i:0, right:0, n:0 };
  S.boss.tries++; save(); nextBoss();
}
function bossHead() {
  return `<div class="taskhead bosshead"><button class="btn ghost small" id="quit">← Aufgeben</button>
    <div class="bossbar"><div class="bb-label"><svg viewBox="0 0 40 40" width="28" height="28">${swirl(20, 20, 16)}</svg><b>Wetterwirbel</b></div>
      <div class="hpbar" role="meter" aria-valuemin="0" aria-valuemax="${R.max}" aria-valuenow="${R.hp}" aria-label="Lebenspunkte Wetterwirbel"><span style="width:${R.hp / R.max * 100}%"></span></div></div>
    <div class="hearts" aria-label="${R.hearts} Herzen">${"<i class='h on'></i>".repeat(R.hearts)}${"<i class='h'></i>".repeat(4 - R.hearts)}<span class="jk">Joker: ${R.jokers}</span></div></div>`;
}
function nextBoss() {
  if (R.hp <= 0 || R.hearts <= 0) return finishBoss();
  const t = R.q[R.i++];
  showTask(t, { head: bossHead(), tries: 1, boss: true, onDone: res => {
    record(t, res); R.n++;
    if (res.ok) { R.hp--; R.right++; } else R.hearts--;
    nextBoss();
  }});
}
function finishBoss() {
  const won = R.hp <= 0, txt = `${R.right} von ${R.n} richtig`;
  if (won) { S.boss.wins++; if (!S.boss.best || R.right / R.n > parseBest(S.boss.best)) S.boss.best = txt; }
  S.log.push({ at: Date.now(), what: "Wetterwirbel", correct: R.right, n: R.n, stars: won ? 1 : 0, boss: true, won }); save();
  R = null;
  app.innerHTML = `<section class="result card ${won ? "win" : ""}">
    ${won ? `<div class="bossbig defeated"><svg viewBox="0 0 120 120" width="140" height="140">${swirl(60, 60, 50)}</svg></div><h2>Der Wetterwirbel ist besiegt!</h2>
    <p class="lead">${txt}. Alle Klimadiagramme sind wieder an ihrem Platz. Du bist bereit für den Test.</p>`
    : `<h2>Der Wetterwirbel ist entkommen</h2><p class="lead">${txt}. Schau ins Forschertagebuch: Dort stehen die Aufgaben, die noch nicht saßen. Danach hast du ihn sicher.</p>`}
    <div class="row center"><button class="btn primary" id="again">${won ? "Nochmal kämpfen" : "Revanche"}</button><button class="btn ghost" id="d">Forschertagebuch</button><button class="btn ghost" id="map">Zur Karte</button></div></section>`;
  $("#again").onclick = bossIntro; $("#d").onclick = diary; $("#map").onclick = home; window.scrollTo(0, 0);
}
const parseBest = s => { const m = /(\d+) von (\d+)/.exec(s || ""); return m ? m[1] / m[2] : 0; };

/* ============ AUFGABEN-ANSICHT ============ */
const KIND = { mc:"Quiz", multi:"Mehrere sind richtig", order:"Reihenfolge", match:"Zuordnen", num:"Rechnen und Ablesen", arid:"Klimadiagramm-Detektiv", map:"Kartenmaler", draw:"Diagramm-Werkstatt", free:"Mit eigenen Worten" };
function showTask(t, opt) {
  const kind = t.t === "mc" && t.d ? "Klimadiagramm-Detektiv" : KIND[t.t];
  app.innerHTML = `${opt.head}<section class="card task t-${t.t}">
    <p class="kicker">${kind}</p><h2 class="q">${esc(t.q)}</h2>
    <div class="tbody"></div><div class="hints" aria-live="polite"></div><div class="fb" hidden aria-live="polite"></div>
    <div class="actions"><button class="btn ghost" id="hintBtn"></button><button class="btn primary" id="checkBtn" disabled>Prüfen</button></div></section>`;
  const body = $(".tbody"), hintsEl = $(".hints"), fb = $(".fb"), hintBtn = $("#hintBtn"), checkBtn = $("#checkBtn");
  const q = $("#quit"); if (q) q.onclick = () => { R = null; home(); };
  let hints = 0, attempt = 1, busy = false;
  const r = RENDER[t.t](t, body, { ready: b => { checkBtn.disabled = !b; } });
  const hl = t.h || [];
  function updHint() {
    if (opt.boss) { hintBtn.textContent = `Joker (${R.jokers})`; hintBtn.disabled = R.jokers <= 0 || hints >= hl.length; }
    else { hintBtn.textContent = hints >= hl.length ? "Keine Tipps mehr" : `Tipp ${hints + 1} von ${hl.length}`; hintBtn.disabled = hints >= hl.length; }
  }
  function giveHint(free) {
    if (hints >= hl.length) return;
    hintsEl.insertAdjacentHTML("beforeend", `<p class="hint"><b>Tipp ${hints + 1}:</b> ${esc(hl[hints])}</p>`);
    hints++; if (opt.boss && !free) R.jokers--; updHint();
  }
  updHint();
  hintBtn.onclick = () => giveHint(false);
  checkBtn.onclick = async () => {
    if (busy) return; busy = true;
    const res = await r.check();
    busy = false;
    if (res.ok) return done(true);
    const maxTries = t.t === "draw" && !opt.boss ? 3 : opt.tries;
    if (attempt < maxTries && t.t !== "free") {
      attempt++;
      fb.hidden = false; fb.className = "fb retry";
      fb.innerHTML = `<b>Noch nicht ganz.</b> ${res.msg ? esc(res.msg) + " " : ""}${maxTries - attempt + 1 > 1 ? `Du hast noch ${maxTries - attempt + 1} Versuche.` : "Du hast noch einen Versuch."}${hints < hl.length ? " Oben ist ein neuer Tipp dazugekommen." : ""}`;
      if (hints < hl.length) giveHint(true);
      r.retry && r.retry();
      return;
    }
    r.reveal && r.reveal(); done(false);
  };
  function done(ok) {
    const pts = ok ? (attempt > 1 ? 1 : Math.max(1, 3 - (opt.boss ? 0 : hints))) : 0;
    r.lock && r.lock();
    fb.hidden = false; fb.className = "fb " + (ok ? "good" : "bad");
    const praise = ["Richtig!", "Genau!", "Stark!", "Volltreffer!", "Super!"][Math.floor(Math.random() * 5)];
    fb.innerHTML = `<b>${ok ? (attempt > 1 ? "Im zweiten Versuch geschafft." : praise) : "Leider falsch."}</b> ${esc(t.e || "")}${!ok ? `<span class="note">Die Aufgabe kommt in dein Forschertagebuch.</span>` : ""}`;
    if (opt.boss) fb.insertAdjacentHTML("afterbegin", `<span class="hit ${ok ? "" : "ouch"}">${ok ? "Treffer!" : "Autsch, ein Herz weniger."}</span>`);
    const a = $(".actions"); a.innerHTML = `<button class="btn primary big" id="nextBtn">Weiter</button>`;
    const nb = $("#nextBtn"); nb.focus({ preventScroll: true });
    nb.onclick = () => opt.onDone({ ok, pts, hints, attempt });
    fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
  window.scrollTo(0, 0);
}

/* ============ RENDERER ============ */
function diagBlock(t) { return t.d ? `<div class="diag">${climateSVG(t.d, { hide: t.dh })}${t.tab ? climateTable(t.d) : ""}</div>` : ""; }
const RENDER = {
  mc(t, el, api) {
    const opts = shuffle(t.o.map((txt, i) => ({ txt, ok: i === (t.a || 0) })));
    let sel = null;
    el.innerHTML = `<div class="${t.d ? "split" : ""}">${diagBlock(t)}<div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o.txt)}</button>`).join("")}</div></div>`;
    const btns = $$(".opt", el);
    btns.forEach(b => b.onclick = () => { if (b.disabled) return; sel = +b.dataset.i; btns.forEach(x => x.classList.toggle("sel", x === b)); api.ready(true); });
    return {
      check: () => ({ ok: opts[sel].ok }),
      retry() { btns[sel].classList.remove("sel"); btns[sel].classList.add("wrong"); btns[sel].disabled = true; sel = null; api.ready(false); },
      reveal() { btns.forEach((b, i) => { if (opts[i].ok) b.classList.add("right"); else if (i === sel) b.classList.add("wrong"); }); },
      lock() { btns.forEach((b, i) => { b.disabled = true; if (i === sel && opts[i].ok) b.classList.add("right"); }); }
    };
  },
  multi(t, el, api) {
    const opts = shuffle(t.o.map((txt, i) => ({ txt, ok: t.a.includes(i) })));
    const sel = new Set();
    el.innerHTML = `<div class="${t.d ? "split" : ""}">${diagBlock(t)}<div class="opts multi">${opts.map((o, i) => `<button class="opt" data-i="${i}" aria-pressed="false"><span class="box"></span>${esc(o.txt)}</button>`).join("")}</div></div>`;
    const btns = $$(".opt", el);
    btns.forEach(b => b.onclick = () => { const i = +b.dataset.i; sel.has(i) ? sel.delete(i) : sel.add(i); b.classList.toggle("sel", sel.has(i)); b.setAttribute("aria-pressed", sel.has(i)); api.ready(sel.size > 0); });
    const nRight = () => opts.filter((o, i) => o.ok === sel.has(i)).length;
    return {
      check() { const k = nRight(); return { ok: k === opts.length, msg: `${k} von ${opts.length} Antworten sind richtig eingestuft.` }; },
      reveal() { btns.forEach((b, i) => { if (opts[i].ok) b.classList.add(sel.has(i) ? "right" : "missed"); else if (sel.has(i)) b.classList.add("wrong"); }); },
      lock() { btns.forEach((b, i) => { b.disabled = true; if (opts[i].ok && sel.has(i)) b.classList.add("right"); }); }
    };
  },
  order(t, el, api) {
    const pool = shuffle(t.o.map((txt, i) => ({ txt, i }))); let ans = [];
    el.innerHTML = `<p class="small">Tippe die Begriffe in der richtigen Reihenfolge an. Tippe in deiner Liste auf einen Begriff, um ihn zurückzulegen.</p>
      <div class="ordergrid"><div><h4>Auswahl</h4><div class="pool"></div></div><div><h4>Deine Reihenfolge</h4><ol class="answer"></ol></div></div>`;
    const poolEl = $(".pool", el), ansEl = $(".answer", el); let locked = false;
    function draw() {
      poolEl.innerHTML = pool.filter(p => !ans.includes(p)).map(p => `<button class="chip" data-i="${p.i}">${esc(p.txt)}</button>`).join("") || `<p class="small muted">Alles eingeordnet.</p>`;
      ansEl.innerHTML = ans.map((p, k) => `<li><button class="chip placed" data-i="${p.i}" data-k="${k}">${esc(p.txt)}</button></li>`).join("") + Array.from({ length: t.o.length - ans.length }, () => `<li class="empty"></li>`).join("");
      $$(".pool .chip", el).forEach(b => b.onclick = () => { if (locked) return; ans.push(pool.find(p => p.i === +b.dataset.i)); draw(); });
      $$(".answer .chip", el).forEach(b => b.onclick = () => { if (locked) return; ans = ans.filter(p => p.i !== +b.dataset.i); draw(); });
      api.ready(ans.length === t.o.length);
    }
    draw();
    return {
      check() { const k = ans.filter((p, i) => p.i === i).length; return { ok: k === t.o.length, msg: `${k} von ${t.o.length} Positionen stimmen.` }; },
      retry() { $$(".answer .chip", el).forEach((b, k) => b.classList.toggle("wrong", +b.dataset.i !== k)); },
      reveal() { $$(".answer .chip", el).forEach((b, k) => b.classList.add(+b.dataset.i === k ? "right" : "wrong")); el.insertAdjacentHTML("beforeend", `<div class="solution"><h4>Richtige Reihenfolge</h4><ol>${t.o.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>`); },
      lock() { locked = true; if (ans.every((p, i) => p.i === i)) $$(".answer .chip", el).forEach(b => b.classList.add("right")); }
    };
  },
  match(t, el, api) {
    const left = t.p.map((p, i) => ({ txt: p[0], i })), right = shuffle(t.p.map((p, i) => ({ txt: p[1], i })));
    const pair = {}; let selL = null, locked = false;
    el.innerHTML = `<p class="small">Tippe links einen Begriff an und dann rechts die passende Erklärung. Tippe einen verbundenen Begriff erneut an, um die Verbindung zu lösen.</p><div class="matchgrid"><div class="mcol l"></div><div class="mcol r"></div></div>`;
    const colors = ["#2a74c9", "#d1342b", "#2f8a4a", "#b36b00", "#7b4bc4", "#0d8a8f"];
    function draw() {
      const usedR = Object.values(pair);
      $(".l", el).innerHTML = left.map(p => `<button class="chip m ${selL === p.i ? "sel" : ""} ${pair[p.i] != null ? "paired" : ""}" data-i="${p.i}" style="${pair[p.i] != null ? `--pc:${colors[p.i % 6]}` : ""}">${pair[p.i] != null ? `<span class="pn">${p.i + 1}</span>` : ""}${esc(p.txt)}</button>`).join("");
      $(".r", el).innerHTML = right.map(p => { const L = Object.keys(pair).find(k => pair[k] === p.i); return `<button class="chip m ${L != null ? "paired" : ""}" data-i="${p.i}" style="${L != null ? `--pc:${colors[L % 6]}` : ""}">${L != null ? `<span class="pn">${+L + 1}</span>` : ""}${esc(p.txt)}</button>`; }).join("");
      $$(".l .chip", el).forEach(b => b.onclick = () => { if (locked) return; const i = +b.dataset.i; if (pair[i] != null) { delete pair[i]; selL = null; } else selL = selL === i ? null : i; draw(); });
      $$(".r .chip", el).forEach(b => b.onclick = () => { if (locked || selL == null) return; const i = +b.dataset.i; for (const k in pair) if (pair[k] === i) delete pair[k]; pair[selL] = i; selL = null; draw(); });
      api.ready(Object.keys(pair).length === left.length);
    }
    draw();
    const nOk = () => left.filter(p => pair[p.i] === p.i).length;
    return {
      check() { const k = nOk(); return { ok: k === left.length, msg: `${k} von ${left.length} Paaren stimmen. Die falschen habe ich wieder gelöst.` }; },
      retry() { for (const k in pair) if (pair[k] !== +k) delete pair[k]; draw(); },
      reveal() { el.insertAdjacentHTML("beforeend", `<div class="solution"><h4>Richtige Paare</h4><ul>${t.p.map(p => `<li><b>${esc(p[0])}</b>: ${esc(p[1])}</li>`).join("")}</ul></div>`); },
      lock() { locked = true; $$(".l .chip", el).forEach(b => b.classList.add(pair[+b.dataset.i] === +b.dataset.i ? "right" : "wrong")); }
    };
  },
  num(t, el, api) {
    el.innerHTML = `<div class="${t.d ? "split" : ""}">${diagBlock(t)}<div class="numwrap"><label for="numIn">Deine Antwort</label><div class="row"><input id="numIn" inputmode="decimal" autocomplete="off" placeholder="z. B. ${t.tol && t.tol < 1 ? "12,5" : "42"}"><span class="unit">${esc(t.u || "")}</span></div>
      <p class="small">Komma oder Punkt sind beide okay. Minus mit „-“.</p></div></div>`;
    const inp = $("#numIn", el);
    const val = () => { const v = parseFloat(inp.value.replace(",", ".").replace("−", "-").replace(/\s/g, "")); return isNaN(v) ? null : v; };
    inp.oninput = () => api.ready(val() !== null);
    inp.onkeydown = e => { if (e.key === "Enter" && val() !== null) $("#checkBtn").click(); };
    return {
      check: () => ({ ok: Math.abs(val() - t.a) <= (t.tol || 0) + 1e-9 }),
      retry() { inp.select(); },
      reveal() { el.querySelector(".numwrap").insertAdjacentHTML("beforeend", `<p class="solution">Richtig ist: <b>${fmt(t.a)} ${esc(t.u || "")}</b></p>`); },
      lock() { inp.disabled = true; }
    };
  },
  arid(t, el, api) {
    const sel = new Set(); let locked = false;
    el.innerHTML = `<div class="diag tapdiag">${climateSVG(t.d, { hide: t.dh, tap: true })}</div><p class="small">Tippe auf einen Monat, um ihn als arid zu markieren. Nochmal tippen hebt die Markierung auf. Markiert: <b class="cnt">0</b></p>`;
    const cols = $$(".cd-tap", el);
    cols.forEach(c => c.addEventListener("click", () => { if (locked) return; const m = +c.dataset.m; sel.has(m) ? sel.delete(m) : sel.add(m); c.classList.toggle("on", sel.has(m)); $(".cnt", el).textContent = sel.size; }));
    api.ready(true);
    const right = () => MON.map((_, i) => isArid(t.d, i) === sel.has(i)).filter(Boolean).length;
    return {
      check() { const k = right(); return { ok: k === 12, msg: `${k} von 12 Monaten sind richtig eingestuft.` }; },
      reveal() { cols.forEach((c, i) => { c.classList.remove("on"); if (isArid(t.d, i)) c.classList.add(sel.has(i) ? "ok" : "miss"); else if (sel.has(i)) c.classList.add("bad"); }); },
      lock() { locked = true; }
    };
  },
  map(t, el, api) {
    const n = t.g.length; let marks = [], locked = false;
    el.innerHTML = `<div class="mapwrap">${mapBase(`<g class="tg"></g><g class="mk"></g>`)}</div>
      <p class="small">${n > 1 ? `Setze ${n} Markierungen. Tippe auf eine Markierung, um sie zu entfernen.` : "Tippe auf die richtige Stelle. Du kannst die Markierung durch erneutes Tippen verschieben."} Gesetzt: <b class="cnt">0</b> von ${n}</p>`;
    const svg = $("svg", el), mk = $(".mk", el);
    function draw() {
      mk.innerHTML = marks.map((m, k) => `<g class="pin" data-k="${k}"><circle cx="${m[0]}" cy="${m[1]}" r="16" class="pin-hit"/><circle cx="${m[0]}" cy="${m[1]}" r="8" class="pin-dot"/></g>`).join("");
      $(".cnt", el).textContent = marks.length; api.ready(marks.length === n);
    }
    svg.addEventListener("click", ev => {
      if (locked) return;
      const pin = ev.target.closest(".pin");
      if (pin && n > 1) { marks.splice(+pin.dataset.k, 1); return draw(); }
      const p = svgPoint(svg, ev);
      if (n === 1) marks = [[p.x, p.y]]; else if (marks.length < n) marks.push([p.x, p.y]); else return toast("Alle Markierungen gesetzt. Tippe eine an, um sie zu entfernen.");
      draw();
    });
    const inBox = (m, b) => { const [lon, lat] = unproj(m[0], m[1]), pad = 3; return lon >= b[0] - pad && lon <= b[2] + pad && lat >= b[1] - pad && lat <= b[3] + pad; };
    const hits = () => t.g.filter(g => marks.some(m => inBox(m, g.b)));
    return {
      check() { const h = hits().length; return { ok: h === n, msg: n > 1 ? `${h} von ${n} Gebieten gefunden.` : "" }; },
      retry() { const good = marks.filter(m => t.g.some(g => inBox(m, g.b))); marks = good; draw(); },
      reveal() {
        $(".tg", el).innerHTML = t.g.map(g => { const [x1, y1] = proj(g.b[0], g.b[3]), [x2, y2] = proj(g.b[2], g.b[1]); return `<rect x="${x1}" y="${y1}" width="${x2 - x1}" height="${y2 - y1}" rx="12" class="tgt"/><text x="${(x1 + x2) / 2}" y="${Math.max(y1 - 6, 14)}" text-anchor="middle" class="tgl">${esc(g.n)}</text>`; }).join("");
      },
      lock() { locked = true; this.reveal(); }
    };
  },
  draw(t, el, api) {
    const c = CLIMATE[t.d], g = geom(c.T, c.N);
    const T = Array(12).fill(null), N = Array(12).fill(0); let mode = "N", locked = false;
    el.innerHTML = `${climateTable(t.d)}
      <div class="units"><label>Einheit links (rote Achse): <select id="uL"><option value="">wählen …</option><option>mm</option><option>°C</option><option>km</option></select></label>
      <label>Einheit rechts (blaue Achse): <select id="uR"><option value="">wählen …</option><option>°C</option><option>mm</option><option>cm</option></select></label></div>
      <div class="modes" role="group" aria-label="Zeichenmodus"><button class="btn mode on" data-m="N">Niederschlag-Säulen</button><button class="btn mode" data-m="T">Temperatur-Punkte</button></div>
      <div class="diag drawdiag"><svg class="climate draw" viewBox="0 0 ${g.W} ${g.H}"></svg></div>
      <p class="small">Tippe in die Spalte eines Monats und ziehe nach oben oder unten. Der Wert wird angezeigt. <span class="live"></span><br>„Prüfen“ geht, sobald beide Einheiten gewählt und alle 12 Temperaturpunkte gesetzt sind.</p>`;
    const svg = $("svg", el), live = $(".live", el);
    const header = `<text x="${g.L}" y="18" class="cd-title">${esc(c.name)} (${esc(c.land)})</text><text x="${g.L}" y="34" class="cd-sub">${esc(c.pos)}</text>
      <text x="${g.L - 6}" y="${g.TOP - 12}" class="cd-unit cd-t ul" text-anchor="end">?</text><text x="${g.L + 12 * g.colW + 6}" y="${g.TOP - 12}" class="cd-unit cd-n ur">?</text>`;
    let wrongSet = new Set();
    function draw() {
      let s = axesSVG(g, header);
      N.forEach((n, i) => { if (n > 0) s += `<rect x="${g.L + i * g.colW + 4}" y="${g.yN(n)}" width="${g.colW - 8}" height="${g.y0 - g.yN(n)}" class="cd-bar ${wrongSet.has("N" + i) ? "err" : ""}"/>`; });
      const pts = T.map((v, i) => v == null ? null : [g.xC(i), g.yT(v)]);
      const seg = pts.filter(Boolean); if (seg.length > 1) s += `<polyline points="${seg.map(p => p.join(",")).join(" ")}" class="cd-line"/>`;
      pts.forEach((p, i) => { if (p) s += `<circle cx="${p[0]}" cy="${p[1]}" r="${wrongSet.has("T" + i) ? 6 : 4}" class="cd-dot ${wrongSet.has("T" + i) ? "err" : ""}"/>`; });
      MON.forEach((_, i) => s += `<rect x="${g.L + i * g.colW}" y="${g.TOP - 10}" width="${g.colW}" height="${g.y0 - g.botU * g.U - g.TOP + 10}" class="cd-drag" data-m="${i}"/>`);
      svg.innerHTML = s;
      $(".ul", svg).textContent = $("#uL", el).value || "?"; $(".ur", svg).textContent = $("#uR", el).value || "?";
      api.ready(T.every(v => v != null) && $("#uL", el).value && $("#uR", el).value);
    }
    let dragM = null;
    function setFrom(ev) {
      const p = svgPoint(svg, ev); const i = dragM;
      if (mode === "N") { let v = g.nFromY(p.y); v = Math.max(0, v <= 100 ? Math.round(v / 5) * 5 : Math.round(v / 10) * 10); v = Math.min(v, 100 + (g.topU - 5) * 100); N[i] = v; live.textContent = `${MONL[i]}: ${v} mm`; }
      else { let v = Math.round(g.tFromY(p.y)); v = Math.max(g.botU * 10, Math.min(g.topU * 10, v)); T[i] = v; live.textContent = `${MONL[i]}: ${fmt(v)} °C`; }
      wrongSet.delete(mode + i); draw();
    }
    svg.addEventListener("pointerdown", ev => { if (locked) return; const r = ev.target.closest(".cd-drag"); const p = svgPoint(svg, ev); let m = r ? +r.dataset.m : Math.floor((p.x - g.L) / g.colW); if (m < 0 || m > 11) return; dragM = m; svg.setPointerCapture(ev.pointerId); setFrom(ev); ev.preventDefault(); });
    svg.addEventListener("pointermove", ev => { if (dragM != null) setFrom(ev); });
    const end = () => { dragM = null; }; svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
    $$(".mode", el).forEach(b => b.onclick = () => { mode = b.dataset.m; $$(".mode", el).forEach(x => x.classList.toggle("on", x === b)); });
    $("#uL", el).onchange = draw; $("#uR", el).onchange = draw;
    draw();
    function errors() {
      const w = new Set();
      c.N.forEach((n, i) => { const tol = n > 100 ? 20 : 10; if (Math.abs(N[i] - n) > tol) w.add("N" + i); });
      c.T.forEach((v, i) => { if (T[i] == null || Math.abs(T[i] - v) > 1) w.add("T" + i); });
      return w;
    }
    return {
      check() {
        const w = errors(), uOk = $("#uL", el).value === "°C" && $("#uR", el).value === "mm";
        const nN = [...w].filter(x => x[0] === "N").length, nT = [...w].filter(x => x[0] === "T").length;
        if (!(w.size === 0 && uOk)) { wrongSet = w; draw(); }
        const parts = []; if (!uOk) parts.push("Die Einheiten stimmen noch nicht."); if (nN) parts.push(`${nN} Säulen sind zu weit daneben (rot markiert).`); if (nT) parts.push(`${nT} Temperaturpunkte sind daneben (rot markiert).`);
        return { ok: w.size === 0 && uOk, msg: parts.join(" ") };
      },
      reveal() { c.N.forEach((n, i) => N[i] = n); c.T.forEach((v, i) => T[i] = v); $("#uL", el).value = "°C"; $("#uR", el).value = "mm"; wrongSet = new Set(); draw(); },
      lock() { locked = true; $("#uL", el).disabled = true; $("#uR", el).disabled = true; }
    };
  },
  free(t, el, api) {
    el.innerHTML = `<div class="${t.d ? "split" : ""}">${diagBlock(t)}<div class="freewrap"><label for="freeIn">Deine Antwort</label><textarea id="freeIn" rows="7" placeholder="Schreib in ganzen Sätzen, wie in der Klassenarbeit."></textarea><p class="small"><span class="wc">0</span> Wörter</p></div></div>`;
    const ta = $("#freeIn", el);
    ta.oninput = () => { const w = ta.value.trim().split(/\s+/).filter(Boolean).length; $(".wc", el).textContent = w; api.ready(w >= 8); };
    return {
      check() {
        return new Promise(res => {
          ta.readOnly = true; $("#checkBtn").hidden = true; $("#hintBtn").hidden = true;
          el.insertAdjacentHTML("beforeend", `<div class="selfcheck"><h4>Vergleiche mit der Musterlösung</h4><p class="model">${esc(t.m)}</p>
            <p><b>Was steht auch in deiner Antwort?</b> Hake ehrlich ab:</p>${t.c.map((x, i) => `<label class="ck"><input type="checkbox" id="ck${i}"> ${esc(x)}</label>`).join("")}
            <button class="btn primary" id="selfDone">Auswerten</button></div>`);
          $(".selfcheck", el).scrollIntoView({ behavior: "smooth", block: "start" });
          $("#selfDone", el).onclick = () => { const k = $$(".ck input:checked", el).length; $$(".ck input", el).forEach(x => x.disabled = true); $("#selfDone", el).remove(); S.lastFree = { k, n: t.c.length };
            res({ ok: k >= Math.ceil(t.c.length * 0.6), msg: "" }); };
        });
      },
      lock() {}
    };
  }
};

/* ============ ELTERNANSICHT ============ */
function parents() {
  const mins = Math.round(S.time / 60);
  const rows = ROUTE.map(id => { const s = S.stats[id] || { answered: 0, correct: 0, first: 0, hints: 0 }; const p = s.answered ? Math.round(s.correct / s.answered * 100) : null; return { id, s, p }; });
  const bs = S.stats.boss;
  const weak = rows.filter(r => r.p != null && r.p < 70).map(r => STATIONS[r.id].name);
  const dg = {}; S.diary.forEach(id => { const t = ALL_TASKS[id]; if (t) (dg[t.st] = dg[t.st] || []).push(t); });
  app.innerHTML = `<div class="crumbs"><button class="btn ghost" id="back">← Karte</button></div>
  <h2 class="pagetitle">Für Eltern</h2>
  <p class="lead">Der Spielstand wird nur auf diesem Gerät in diesem Browser gespeichert.</p>
  <div class="kpis"><div class="kpi"><b>${mins}</b><span>Minuten gespielt</span></div><div class="kpi"><b>${Object.keys(S.stamps).length}/8</b><span>Stempel</span></div>
    <div class="kpi"><b>${totalStars()}/24</b><span>Sterne</span></div><div class="kpi"><b>${S.boss.wins}/${S.boss.tries}</b><span>Bossfight gewonnen/versucht</span></div></div>
  <section class="card"><h3>So läuft es pro Zone</h3>
    <p class="small">Anteil richtig gelöster Aufgaben. „Sofort“ heißt: beim ersten Versuch ohne Tipp.</p>
    <div class="ptable">${rows.map(r => `<div class="prow"><span class="pz" style="--z:${STATIONS[r.id].color}">${esc(STATIONS[r.id].name)}</span>
      <span class="pbar"><i style="width:${r.p ?? 0}%;background:${r.p == null ? "transparent" : r.p >= 80 ? "var(--ok)" : r.p >= 60 ? "var(--gold)" : "var(--bad)"}"></i></span>
      <span class="pv">${r.p == null ? "noch nicht gespielt" : `${r.p} % · ${r.s.correct}/${r.s.answered} · sofort ${r.s.first} · Tipps ${r.s.hints}`}</span></div>`).join("")}
      ${bs ? `<div class="prow"><span class="pz" style="--z:var(--boss)">Bossfight</span><span class="pbar"><i style="width:${Math.round(bs.correct / bs.answered * 100)}%;background:var(--pri)"></i></span><span class="pv">${Math.round(bs.correct / bs.answered * 100)} % · ${bs.correct}/${bs.answered}</span></div>` : ""}</div>
    ${weak.length ? `<p class="advice"><b>Hier lohnt sich Üben:</b> ${weak.map(esc).join(", ")}. Gut ist es, gemeinsam die Lernkarte anzusehen und dann die Station noch einmal zu spielen.</p>` : ""}</section>
  <section class="card"><h3>Offene Aufgaben im Forschertagebuch (${S.diary.length})</h3>
    ${S.diary.length ? Object.entries(dg).map(([st, ts]) => `<h4>${st === "boss" ? "Bossfight" : esc(STATIONS[st].name)}</h4><ul class="plist">${ts.map(t => `<li>${esc(t.q)}</li>`).join("")}</ul>`).join("") : `<p>Keine. Alles, was falsch war, wurde inzwischen richtig gelöst.</p>`}</section>
  <section class="card"><h3>Letzte Runden</h3>${S.log.length ? `<ul class="plist">${S.log.slice(-12).reverse().map(l => `<li>${new Date(l.at).toLocaleString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}: <b>${esc(l.what)}</b>, ${l.correct} von ${l.n} richtig${l.boss ? (l.won ? " · gewonnen" : " · verloren") : l.stars ? " · " + "★".repeat(l.stars) : ""}</li>`).join("")}</ul>` : "<p>Noch keine Runde gespielt.</p>"}</section>
  <section class="card"><h3>Einstellungen</h3>
    <label class="ck"><input type="checkbox" id="unl" ${S.unlockAll ? "checked" : ""}> Alle Stationen und den Bossfight sofort freischalten (z. B. um gezielt den Regenwald zu üben)</label>
    <div class="row"><button class="btn ghost danger" id="reset">Spielstand löschen</button></div>
    <div class="confirm" hidden><p>Wirklich alles löschen? Stempel, Sterne und Tagebuch sind dann weg.</p><div class="row"><button class="btn danger" id="yes">Ja, löschen</button><button class="btn ghost" id="no">Abbrechen</button></div></div></section>`;
  $("#back").onclick = home;
  $("#unl").onchange = e => { S.unlockAll = e.target.checked; save(); toast(S.unlockAll ? "Alle Stationen sind freigeschaltet." : "Freischaltung wieder an den Reiseverlauf gebunden."); };
  $("#reset").onclick = () => { $(".confirm").hidden = false; };
  $("#no").onclick = () => { $(".confirm").hidden = true; };
  $("#yes").onclick = () => { S = blank(); save(); home(); toast("Spielstand gelöscht."); };
  window.scrollTo(0, 0);
}

home();

</script>
