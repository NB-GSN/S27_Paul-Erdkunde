<title>Expedition Äquator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: Expeditions-Atlas. Karte oben als Bühne, darunter Stationskarten; Aufgaben als einzelne große Karten, tablet-first. */
:root{
  --bg:#e8efed; --panel:#fbfdfc; --panel2:#eef4f2; --ink:#13303a; --muted:#56717b; --line:#cbdad7;
  --ocean:#cfe4ec; --landc:#efe7d4; --coast:#a99a7c; --grid:#86a6b1; --locked:#b7c3c4;
  --pri:#0c6a70; --pri-ink:#ffffff; --gold:#d99a00; --ok:#2c8547; --okbg:#e1f2e5; --bad:#c03d2c; --badbg:#fbe6e2;
  --temp:#d1342b; --prec:#2a74c9; --hint:#fff3d1; --hintink:#5e4500; --boss:#6b3fb8; --sel:#dbeef0;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1c21; --panel:#14282e; --panel2:#1a3239; --ink:#e3eeec; --muted:#93afb2; --line:#29444c;
  --ocean:#11343e; --landc:#36473c; --coast:#5f7466; --grid:#4f7380; --locked:#46585c;
  --pri:#40b8b0; --pri-ink:#04201f; --gold:#f2b632; --ok:#5cc47a; --okbg:#16362a; --bad:#ff7d69; --badbg:#3c1f1b;
  --temp:#ff6b5d; --prec:#62a9ff; --hint:#3a3116; --hintink:#f5dc96; --boss:#a98aff; --sel:#1d3f45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1c21; --panel:#14282e; --panel2:#1a3239; --ink:#e3eeec; --muted:#93afb2; --line:#29444c;
  --ocean:#11343e; --landc:#36473c; --coast:#5f7466; --grid:#4f7380; --locked:#46585c;
  --pri:#40b8b0; --pri-ink:#04201f; --gold:#f2b632; --ok:#5cc47a; --okbg:#16362a; --bad:#ff7d69; --badbg:#3c1f1b;
  --temp:#ff6b5d; --prec:#62a9ff; --hint:#3a3116; --hintink:#f5dc96; --boss:#a98aff; --sel:#1d3f45; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:1100px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.35rem,2.8vw,1.8rem);font-weight:800}
h3{font-size:1.2rem;font-weight:800}
h4{font-size:1rem;font-weight:600;color:var(--muted)}
p{margin:0}
.small{font-size:.9rem;color:var(--muted)}
.muted{color:var(--muted)}
.lead{font-size:1.05rem;max-width:65ch}
.kicker{font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.btn{font:inherit;font-weight:700;border-radius:999px;border:2px solid transparent;padding:10px 18px;cursor:pointer;min-height:46px;color:var(--ink);background:transparent;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--pri);color:var(--pri-ink)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{border-color:var(--line);background:var(--panel)}
.btn.ghost:disabled{opacity:.5}
.btn.big{font-size:1.1rem;padding:12px 26px;min-height:54px}
.btn.small{min-height:40px;padding:6px 14px;font-size:.9rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:not(.ghost){background:var(--bad);color:var(--pri-ink)}
.linkbtn{font:inherit;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--bad);color:#fff;font-size:.75rem;margin-left:4px;padding:0 6px}
/* Kopf */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.top .sub{color:var(--muted);margin-top:4px;font-family:var(--mono);font-size:.85rem}
.topnav{display:flex;gap:8px;flex-wrap:wrap}
.namecard label{font-family:var(--display);font-weight:800;font-size:1.2rem;display:block;margin-bottom:8px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px}
#nameIn{flex:1;min-width:0;max-width:320px}
/* Karte */
.mapcard{padding:10px}
.worldmap{width:100%;height:auto;display:block;border-radius:10px;touch-action:manipulation}
.m-ocean{fill:var(--ocean)}
.m-land{fill:var(--landc);stroke:var(--coast);stroke-width:.6}
.m-lat{stroke:var(--grid);stroke-width:1;stroke-dasharray:5 5;opacity:.8}
.m-eq{stroke-width:1.6;stroke-dasharray:none}
.m-latlab{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.m-route{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-dasharray:2 6;stroke-linecap:round;opacity:.55}
.m-st{cursor:pointer}
.m-st.locked{cursor:not-allowed;opacity:.75}
.m-dot{stroke:var(--panel);stroke-width:3}
.m-st.done .m-dot{stroke:var(--gold);stroke-width:3.5}
.m-num{font-family:var(--display);font-weight:800;font-size:15px;fill:#11242a;pointer-events:none}
.m-pulse{fill:none;stroke:var(--gold);stroke-width:3;animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{transform:scale(.7);opacity:1}to{transform:scale(1.5);opacity:0}}
.m-bossdot{fill:var(--boss);opacity:.2}
.m-boss.locked{opacity:.45}
.sw{fill:none;stroke:var(--boss);stroke-width:3;stroke-linecap:round}
.swirl{animation:spin 6s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(-360deg)}}
.maphint{padding:8px 6px 2px;color:var(--muted);font-size:.92rem}
/* Stationskarten */
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.stcard{font:inherit;color:var(--ink);text-align:left;display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);cursor:pointer;position:relative;overflow:hidden;min-height:88px}
.stcard::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:var(--z)}
.stcard.locked{opacity:.55;cursor:not-allowed}
.stnum{font-family:var(--display);font-weight:800;font-size:1.6rem;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--z);color:#11242a;flex:none;margin-left:4px}
.stbody{display:flex;flex-direction:column;min-width:0;flex:1}
.stzone{font-size:.78rem;color:var(--muted)}
.stzone .bonus{color:var(--pri)}
.stname{font-family:var(--display);font-weight:800;font-size:1.15rem}
.stplace{font-size:.88rem;color:var(--muted)}
.ststars{color:var(--gold);font-size:1.1rem;letter-spacing:1px;flex:none;font-size:.95rem}
.bosscard{grid-column:1/-1;--z:var(--boss)}
.bossicon{width:48px;display:grid;place-items:center;flex:none}
.foot{text-align:center}
/* Intro */
.crumbs{display:flex;gap:8px}
.intro{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;border-top:8px solid var(--z)}
.introtext{display:flex;flex-direction:column;gap:12px;min-width:0}
.story{font-size:1.08rem;max-width:60ch}
.meta{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.introside{min-width:0}
@media (max-width:760px){.intro{grid-template-columns:1fr}}
.lernkarte{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lk-head{background:var(--z);padding:12px 18px;color:#11242a}
.lk-head .lk-zone{font-family:var(--mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.lernkarte dl{margin:0;padding:6px 18px 14px;display:grid;gap:0}
.lernkarte dl>div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.lernkarte dl>div:last-child{border-bottom:0}
.lernkarte dt{font-weight:700}
.lernkarte dd{margin:0}
@media (max-width:560px){.lernkarte dl>div{grid-template-columns:1fr;gap:2px}}
.pagetitle{font-size:clamp(1.6rem,3.5vw,2.2rem)}
.atlasgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-items:start}
.method ol{margin:10px 0;padding-left:22px;display:grid;gap:4px}
.method p{margin-top:8px}
/* Klimadiagramm */
.climate{width:100%;max-width:520px;height:auto;display:block;background:var(--panel2);border-radius:10px}
.cd-grid{stroke:var(--line);stroke-width:1}
.cd-zero{stroke:var(--ink);stroke-width:1.4}
.cd-ax{stroke-width:2}
.cd-axt{stroke:var(--temp)} .cd-axn{stroke:var(--prec)}
.cd-break{stroke:var(--prec);stroke-width:1.5;fill:none}
.cd-lab{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.cd-lab.cd-t,.cd-unit.cd-t{fill:var(--temp)} .cd-lab.cd-n,.cd-unit.cd-n{fill:var(--prec)}
.cd-unit{font-family:var(--mono);font-size:11px;font-weight:700}
.cd-title{font-family:var(--display);font-weight:800;font-size:14px;fill:var(--ink)}
.cd-sub{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.cd-bar{fill:var(--prec);opacity:.85}
.cd-bar.err{fill:var(--bad);opacity:1}
.cd-line{fill:none;stroke:var(--temp);stroke-width:2.5;stroke-linejoin:round}
.cd-dot{fill:var(--temp)}
.cd-dot.err{fill:var(--bad);stroke:var(--panel);stroke-width:2}
.cd-tap{fill:transparent;cursor:pointer}
.cd-tap.on{fill:var(--gold);opacity:.32}
.cd-tap.ok{fill:var(--ok);opacity:.3} .cd-tap.miss{fill:var(--gold);opacity:.35;stroke:var(--bad);stroke-width:2;stroke-dasharray:4 3} .cd-tap.bad{fill:var(--bad);opacity:.3}
.cd-drag{fill:transparent;cursor:ns-resize}
.drawdiag .climate{max-width:620px;touch-action:none}
.tablewrap{overflow-x:auto;margin-top:10px}
.ctab{border-collapse:collapse;font-family:var(--mono);font-size:.82rem;font-variant-numeric:tabular-nums;width:100%;min-width:440px}
.ctab th,.ctab td{border:1px solid var(--line);padding:5px 4px;text-align:center}
.ctab tbody th{color:var(--muted)}
.ctab tbody tr:first-child td{color:var(--temp)} .ctab tbody tr:last-child td{color:var(--prec)}
/* Aufgaben */
.taskhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tinfo{display:flex;flex-direction:column;line-height:1.2}
.tinfo b{font-family:var(--display);font-size:1.1rem}
.tinfo span{font-size:.85rem;color:var(--muted)}
.pdots{display:flex;gap:6px;margin-left:auto}
.pdot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.pdot.ok{background:var(--ok)} .pdot.bad{background:var(--bad)} .pdot.now{background:var(--z);box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--z)}
.task{display:flex;flex-direction:column;gap:16px;padding:22px}
.task .q{font-size:clamp(1.2rem,2.4vw,1.5rem);max-width:60ch}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;min-height:56px;display:flex;gap:12px;align-items:center}
.opt.sel{border-color:var(--pri);background:var(--sel)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);text-decoration:line-through;text-decoration-thickness:1px}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default}
.opt .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:none}
.opt.sel .box{background:var(--pri);border-color:var(--pri);box-shadow:inset 0 0 0 3px var(--panel2)}
.hints{display:grid;gap:8px}
.hint{background:var(--hint);color:var(--hintink);padding:10px 14px;border-radius:10px}
.fb{padding:14px 16px;border-radius:12px;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--okbg);border:2px solid var(--ok)}
.fb.bad{background:var(--badbg);border:2px solid var(--bad)}
.fb.retry{background:var(--hint);color:var(--hintink)}
.fb b{font-family:var(--display);font-size:1.1rem}
.fb .note{font-size:.85rem;color:var(--muted)}
.hit{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--boss)}
.hit.ouch{color:var(--bad)}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chip{font:inherit;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;text-align:left;min-height:48px;width:100%}
.chip.right{border-color:var(--ok);background:var(--okbg)} .chip.wrong{border-color:var(--bad);background:var(--badbg)}
.ordergrid,.matchgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:600px){.ordergrid{grid-template-columns:1fr}}
.pool{display:grid;gap:8px;margin-top:8px}
.answer{margin:8px 0 0;padding-left:26px;display:grid;gap:8px}
.answer li::marker{font-family:var(--mono);color:var(--muted)}
.answer li.empty{height:48px;border:2px dashed var(--line);border-radius:10px}
.chip.placed{border-color:var(--pri)}
.mcol{display:grid;gap:8px;align-content:start}
.chip.m.sel{border-color:var(--gold);background:var(--hint);color:var(--hintink)}
.chip.m.paired{border-color:var(--pc)}
.pn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pc);color:#fff;font-size:.8rem;font-weight:700;margin-right:8px}
.solution{background:var(--panel2);border-radius:10px;padding:12px 14px}
.solution ol,.solution ul{margin:6px 0 0;padding-left:22px}
.numwrap,.freewrap{display:flex;flex-direction:column;gap:8px}
.numwrap label,.freewrap label{font-weight:700}
#numIn{font-family:var(--mono);font-size:1.4rem;width:180px}
.unit{font-family:var(--mono);font-size:1.2rem}
textarea{width:100%;resize:vertical;line-height:1.5}
.selfcheck{background:var(--panel2);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-top:14px}
.model{border-left:4px solid var(--pri);padding-left:12px}
.ck{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:4px 0}
.ck input{width:24px;height:24px;min-height:0;flex:none;margin-top:1px}
.mapwrap .worldmap{cursor:crosshair}
.pin-hit{fill:transparent}
.pin-dot{fill:var(--bad);stroke:var(--panel);stroke-width:3}
.tgt{fill:var(--ok);opacity:.25;stroke:var(--ok);stroke-width:2}
.tgl{font-family:var(--display);font-weight:800;font-size:15px;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.units{display:flex;gap:14px;flex-wrap:wrap}
.units label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.92rem}
.modes{display:flex;gap:8px;flex-wrap:wrap}
.btn.mode{border-color:var(--line);background:var(--panel2)}
.btn.mode.on{background:var(--ink);color:var(--bg)}
.live{font-family:var(--mono);color:var(--ink);font-weight:700}
/* Boss */
.bosshead{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.bossbar{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.bb-label{display:flex;align-items:center;gap:8px;font-family:var(--display)}
.hpbar{height:16px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.hpbar span{display:block;height:100%;background:linear-gradient(90deg,var(--boss),var(--bad));transition:width .5s}
.hearts{display:flex;align-items:center;gap:6px}
.h{width:22px;height:20px;display:inline-block;background:var(--line);clip-path:path("M11 19 L2 10 A5 5 0 0 1 11 4 A5 5 0 0 1 20 10 Z")}
.h.on{background:var(--bad)}
.jk{font-family:var(--mono);font-size:.85rem;margin-left:8px;color:var(--muted)}
.bossintro{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:640px){.bossintro{grid-template-columns:1fr;justify-items:center}}
.bossintro>div:last-child{display:flex;flex-direction:column;gap:12px}
.rules{margin:0;padding-left:20px;display:grid;gap:6px}
.bossbig.defeated .swirl{animation:spin 1.2s linear infinite;opacity:.4}
/* Ergebnis */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:32px 20px}
.bigstars{font-size:2.6rem;color:var(--gold);letter-spacing:6px}
.stampin{animation:stampin .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampin{from{transform:scale(2.2) rotate(-25deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.stamp .st-o{fill:none;stroke:var(--z);stroke-width:4}
.stamp .st-i{fill:color-mix(in srgb,var(--z) 18%,transparent);stroke:var(--z);stroke-width:1.5;stroke-dasharray:3 3}
.stamp .st-t{font-family:var(--display);font-weight:800;font-size:11px;fill:var(--ink);letter-spacing:1px}
.stamp .st-n{font-family:var(--display);font-weight:800;font-size:22px;fill:var(--ink)}
.stamp .st-s{font-family:var(--mono);font-size:8px;fill:var(--muted)}
.passgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.passslot{aspect-ratio:1/1.1;max-width:100%;border:2px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:10px;color:var(--muted)}
.passslot.has{border-style:solid;background:var(--panel)}
.passslot.has .stamp{transform:rotate(-8deg)}
.passslot small{color:var(--gold)}
/* Tagebuch / Eltern */
.dlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.dlist li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.dz,.pz{font-size:.78rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.dz::before,.pz::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--z)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column}
.kpi b{font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.9rem}
.ptable{display:grid;gap:10px;margin-top:12px}
.prow{display:grid;grid-template-columns:150px minmax(80px,1fr) minmax(0,1.3fr);gap:12px;align-items:center}
@media (max-width:640px){.prow{grid-template-columns:1fr}}
.pbar{height:12px;border-radius:6px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%}
.pv{font-family:var(--mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.advice{margin-top:14px;background:var(--hint);color:var(--hintink);padding:10px 14px;border-radius:10px}
.plist{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
section.card h3{margin-bottom:6px}
section.card h4{margin-top:12px}
